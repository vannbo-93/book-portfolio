<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== العنوان والوصف: يظهران في تبويب المتصفح ونتائج Google ===== -->
    <title>USSAIN</title>
    <meta
      name="description"
      content="Book designer for authors and brands: covers, interiors, journals, planners, workbooks and ebooks, ready for print and digital." />

    <!-- ===== بطاقة المعاينة عند مشاركة الرابط (Facebook, LinkedIn, WhatsApp...) =====
         ⚠ بعد رفع الموقع: استبدل https://YOUR-DOMAIN.com برابط موقعك الحقيقي في السطرين og:url وog:image
         (المنصات لا تقبل صورة بدون رابط كامل) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="USSAIN" />
    <meta property="og:title" content="USSAIN — Book Designer" />
    <meta
      property="og:description"
      content="Covers, interiors, journals, planners, workbooks and ebooks." />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="USSAIN — Book designer portfolio" />

    <!-- ===== نفس البطاقة لـ X (Twitter): صورة كبيرة ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="USSAIN — Book Designer" />
    <meta
      name="twitter:description"
      content="Covers, interiors, journals, planners, workbooks and ebooks." />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />

    <!-- لون شريط المتصفح على الهاتف (أسود مثل شاشة الدخول) -->
    <meta name="theme-color" content="#000000" />

    <!-- أيقونة التبويب: ضع ملف favicon.svg في مجلد public (أو احذف السطر) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
